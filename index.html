<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>SPACE PHOTO - UFO MISSION</title>
<style>
/* =========================
   BASE
========================= */
*{
  box-sizing:border-box;
}
html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
/* =========================
   SPACE
========================= */
#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #182f6b 0%,
      #09112f 40%,
      #02030b 72%,
      #000 100%
    );
}
/* =========================
   STARS
========================= */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  z-index:1;
}
/* =========================
   EARTH
========================= */
.earth{
  position:absolute;
  width:230px;
  height:230px;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 28%,
      #d5f8ff 0%,
      #65b3ed 20%,
      #286bc8 45%,
      #102e76 70%,
      #020817 100%
    );
  box-shadow:
    0 0 40px
    rgba(70,160,255,.8),
    0 0 100px
    rgba(50,110,255,.35);
  z-index:2;
}
/* =========================
   ORBIT
========================= */
.orbit{
  position:absolute;
  width:90vw;
  height:45vw;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%)
    rotate(-12deg);
  border:
    1px solid
    rgba(120,180,255,.2);
  border-radius:50%;
  z-index:1;
}
/* =========================
   UFO AREA
========================= */
#ships{
  position:absolute;
  inset:0;
  z-index:20;
}
/* =========================
   UFO SIZE - MEDIUM
========================= */
.ship{
  position:absolute;
  width:320px;
  height:190px;
  pointer-events:none;
  animation:
    fly
    var(--speed)
    linear
    forwards;
  filter:
    drop-shadow(
      0 0 15px
      rgba(70,180,255,.55)
    );
}
/* =========================
   FLIGHT
========================= */
@keyframes fly{
  0%{
    transform:
      translate(
        -380px,
        var(--y1)
      )
      rotate(
        var(--angle)
      )
      scale(
        var(--scale)
      );
  }
  50%{
    transform:
      translate(
        50vw,
        var(--y2)
      )
      rotate(
        calc(var(--angle) * -1)
      )
      scale(
        var(--scale)
      );
  }
  100%{
    transform:
      translate(
        calc(100vw + 380px),
        var(--y3)
      )
      rotate(
        var(--angle)
      )
      scale(
        var(--scale)
      );
  }
}
/* =========================
   UFO BODY
========================= */
.ufo{
  position:absolute;
  left:25px;
  top:55px;
  width:270px;
  height:90px;
  border-radius:50%;
  background:
    linear-gradient(
      180deg,
      #eef4fa 0%,
      #aab8c7 25%,
      #586879 55%,
      #1c2737 100%
    );
  border:
    2px solid
    rgba(255,255,255,.75);
  box-shadow:
    inset
    0 12px 18px
    rgba(255,255,255,.45),
    inset
    0 -18px 22px
    rgba(0,0,0,.65),
    0 0 30px
    rgba(70,180,255,.6);
}
/* =========================
   UFO LOWER RIM
========================= */
.ufo::before{
  content:"";
  position:absolute;
  left:-8px;
  top:34px;
  width:286px;
  height:50px;
  border-radius:50%;
  border:
    4px solid
    #34485e;
  box-shadow:
    0 0 12px
    rgba(70,180,255,.9),
    inset
    0 0 10px
    rgba(0,0,0,.6);
}
/* =========================
   DOME
========================= */
.dome{
  position:absolute;
  left:85px;
  top:-5px;
  width:100px;
  height:65px;
  overflow:hidden;
  border-radius:
    50% 50% 45% 45%;
  background:
    radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,.8),
      #68b9ee 20%,
      #194b88 65%,
      #061426 100%
    );
  border:
    3px solid
    #203752;
  box-shadow:
    0 0 20px
    rgba(70,190,255,.95);
  z-index:5;
}
/* =========================
   PHOTO
========================= */
.dome img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
/* =========================
   GLASS REFLECTION
========================= */
.dome::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.42),
      transparent 45%
    );
  pointer-events:none;
}
/* =========================
   UFO LIGHTS
========================= */
.light{
  position:absolute;
  top:76px;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#74edff;
  box-shadow:
    0 0 10px
    #74edff,
    0 0 25px
    #298cff;
  animation:
    blink
    .45s
    infinite
    alternate;
}
.light1{
  left:38px;
}
.light2{
  left:88px;
}
.light3{
  left:138px;
}
.light4{
  left:188px;
}
/* =========================
   LIGHT ANIMATION
========================= */
@keyframes blink{
  from{
    opacity:.35;
  }
  to{
    opacity:1;
  }
}
/* =========================
   TITLE
========================= */
.title{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  color:white;
  font-size:
    clamp(
      22px,
      4vw,
      40px
    );
  font-weight:900;
  letter-spacing:6px;
  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;
  z-index:100;
}
.subtitle{
  position:absolute;
  top:64px;
  width:100%;
  text-align:center;
  color:#91aaff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
}
/* =========================
   UPLOAD BUTTON
========================= */
.upload{
  position:absolute;
  right:20px;
  bottom:20px;
  padding:
    12px 20px;
  border-radius:25px;
  background:#315bd5;
  color:white;
  text-decoration:none;
  z-index:100;
  box-shadow:
    0 0 20px
    rgba(50,120,255,.6);
}
/* =========================
   MISSION
========================= */
.mission{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:
    translateX(-50%);
  color:#9db6ff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
  white-space:nowrap;
}
</style>
</head>
<body>
<div id="space">
  <div class="title">
    SPACE PHOTO
  </div>
  <div class="subtitle">
    ALIEN UFO MISSION
  </div>
  <div class="orbit"></div>
  <div class="earth"></div>
  <div id="ships"></div>
  <div class="mission">
    🛸 INFINITE UFO MISSION
  </div>
  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>
</div>
<script>
/* =========================
   CREATE STARS
========================= */
const space =
  document.getElementById(
    "space"
  );
for(
  let i=0;
  i<300;
  i++
){
  const star =
    document.createElement(
      "div"
    );
  star.className="star";
  const size =
    Math.random()*3+1;
  star.style.width =
    size+"px";
  star.style.height =
    size+"px";
  star.style.left =
    Math.random()*100+"%";
  star.style.top =
    Math.random()*100+"%";
  star.style.opacity =
    Math.random();
  space.appendChild(
    star
  );
}
/* =========================
   UFO SYSTEM
========================= */
const ships =
  document.getElementById(
    "ships"
  );
let photos=[];
/* =========================
   LOAD PHOTOS
========================= */
async function loadPhotos(){
  try{
    const response =
      await fetch(
        "/api/photos"
      );
    if(
      !response.ok
    ){
      return;
    }
    const data =
      await response.json();
    if(
      Array.isArray(data)
    ){
      photos=data;
    }
  }
  catch(error){
    console.log(
      "Photo API error:",
      error
    );
  }
}
/* =========================
   FIND PHOTO URL
========================= */
function getImage(photo){
  return (
    photo.data ||
    photo.url ||
    photo.image ||
    photo.src ||
    ""
  );
}
/* =========================
   CREATE UFO
========================= */
function createUFO(){
  /*
    ถ้ายังไม่มีรูป
    ไม่สร้าง UFO
  */
  if(
    photos.length===0
  ){
    return;
  }
  /*
    สุ่มรูป
  */
  const photo =
    photos[
      Math.floor(
        Math.random() *
        photos.length
      )
    ];
  const image =
    getImage(photo);
  const ship =
    document.createElement(
      "div"
    );
  ship.className =
    "ship";
  /*
    ความเร็ว
    9 - 25 วินาที
  */
  const speed =
    9 +
    Math.random()*16;
  ship.style.setProperty(
    "--speed",
    speed+"s"
  );
  /*
    เส้นทาง
  */
  ship.style.setProperty(
    "--y1",
    (5+Math.random()*80)+"vh"
  );
  ship.style.setProperty(
    "--y2",
    (5+Math.random()*80)+"vh"
  );
  ship.style.setProperty(
    "--y3",
    (5+Math.random()*80)+"vh"
  );
  /*
    ขนาดกลาง
    85 - 105%
  */
  ship.style.setProperty(
    "--scale",
    .85+
    Math.random()*.20
  );
  /*
    เอียงเล็กน้อย
  */
  ship.style.setProperty(
    "--angle",
    (-5+
    Math.random()*10)+"deg"
  );
  ship.innerHTML=`
    <div class="ufo">
      <div class="dome">
        ${
          image
          ?
          `<img src="${image}">`
          :
          ""
        }
      </div>
      <div class="light light1"></div>
      <div class="light light2"></div>
      <div class="light light3"></div>
      <div class="light light4"></div>
    </div>
  `;
  ships.appendChild(
    ship
  );
  /*
    ลบเมื่อบินออกจากจอ
  */
  setTimeout(
    ()=>{
      ship.remove();
    },
    speed*1000+1000
  );
}
/* =========================
   START
========================= */
async function start(){
  await loadPhotos();
  /*
    UFO ชุดแรก
  */
  for(
    let i=0;
    i<8;
    i++
  ){
    setTimeout(
      createUFO,
      i*800
    );
  }
  /*
    สร้าง UFO ใหม่
    ทุก 1 วินาที
  */
  setInterval(
    createUFO,
    1000
  );
  /*
    ตรวจรูปใหม่
    ทุก 5 วินาที
  */
  setInterval(
    loadPhotos,
    5000
  );
}
start();
</script>
</body>
</html>
