<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPACE PHOTO MISSION</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,
      #182f6b 0%,
      #09112f 40%,
      #02030b 75%,
      #000 100%);
}
/* ดาว */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  z-index:1;
}
/* โลก */
.earth{
  position:absolute;
  width:230px;
  height:230px;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,
      #d5f8ff 0%,
      #65b3ed 20%,
      #286bc8 45%,
      #102e76 70%,
      #020817 100%);
  box-shadow:
    0 0 40px rgba(70,160,255,.8),
    0 0 100px rgba(50,110,255,.35);
  z-index:2;
}
/* วงโคจร */
.orbit{
  position:absolute;
  width:90vw;
  height:45vw;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%)
    rotate(-12deg);
  border:1px solid rgba(120,180,255,.2);
  border-radius:50%;
  z-index:1;
}
#ships{
  position:absolute;
  inset:0;
  z-index:20;
}
/* ยาน */
.ship{
  position:absolute;
  width:330px;
  height:190px;
  pointer-events:none;
  animation:
    fly var(--speed)
    linear forwards;
  filter:
    drop-shadow(
      0 0 14px
      var(--glow)
    );
}
@keyframes fly{
  0%{
    transform:
      translate(-380px,var(--y1))
      rotate(var(--angle))
      scale(var(--scale));
  }
  50%{
    transform:
      translate(50vw,var(--y2))
      rotate(calc(var(--angle) * -1))
      scale(var(--scale));
  }
  100%{
    transform:
      translate(calc(100vw + 380px),var(--y3))
      rotate(var(--angle))
      scale(var(--scale));
  }
}
/* =========================
   UFO
========================= */
.ufo{
  position:absolute;
  left:25px;
  top:55px;
  width:270px;
  height:90px;
  border-radius:50%;
  background:
    linear-gradient(
      180deg,
      var(--ufoTop),
      var(--ufoMid) 45%,
      var(--ufoBottom)
    );
  border:2px solid rgba(255,255,255,.7);
  box-shadow:
    inset 0 10px 18px rgba(255,255,255,.35),
    inset 0 -18px 22px rgba(0,0,0,.65),
    0 0 25px var(--glow);
}
.ufo::before{
  content:"";
  position:absolute;
  left:-8px;
  top:35px;
  width:286px;
  height:50px;
  border-radius:50%;
  border:4px solid var(--rim);
  box-shadow:0 0 14px var(--glow);
}
/* โดม */
.dome{
  position:absolute;
  left:85px;
  top:-5px;
  width:100px;
  height:65px;
  overflow:hidden;
  border-radius:50% 50% 45% 45%;
  background:
    radial-gradient(
      circle at 30% 20%,
      white,
      var(--glass) 25%,
      #09203c 100%
    );
  border:3px solid #203752;
  box-shadow:0 0 20px var(--glow);
  z-index:5;
}
.dome img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.dome::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.4),
      transparent 45%
    );
  pointer-events:none;
}
/* ไฟ UFO */
.light{
  position:absolute;
  top:76px;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--light);
  box-shadow:
    0 0 10px var(--light),
    0 0 25px var(--light);
  animation:blink .45s infinite alternate;
}
.light1{left:38px}
.light2{left:88px}
.light3{left:138px}
.light4{left:188px}
@keyframes blink{
  from{opacity:.35}
  to{opacity:1}
}
/* =========================
   ROCKET
========================= */
.rocket{
  position:absolute;
  left:75px;
  top:48px;
  width:90px;
  height:145px;
  transform:rotate(90deg);
  border-radius:
    50% 50% 35% 35%;
  background:
    linear-gradient(
      90deg,
      #202936,
      #e8edf3 35%,
      #7b8795 70%,
      #1b2430
    );
  border:2px solid rgba(255,255,255,.7);
  box-shadow:
    0 0 20px var(--glow);
}
/* หัวจรวด */
.rocket::before{
  content:"";
  position:absolute;
  left:0;
  top:-32px;
  width:90px;
  height:52px;
  border-radius:
    50% 50% 10% 10%;
  background:
    linear-gradient(
      90deg,
      #303a47,
      #f2f5f8,
      #303a47
    );
}
/* หน้าต่าง */
.rocket-window{
  position:absolute;
  left:20px;
  top:36px;
  width:50px;
  height:50px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #17283c;
  background:#123c65;
  box-shadow:0 0 15px var(--glow);
}
.rocket-window img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* ไม่มีหาง */
/* ไม่มีเปลวไฟ */
/* =========================
   SATELLITE
========================= */
.satellite{
  position:absolute;
  left:65px;
  top:65px;
  width:140px;
  height:75px;
  background:
    linear-gradient(
      180deg,
      #aeb9c6,
      #465467
    );
  border-radius:12px;
  border:2px solid #d7e0e8;
  box-shadow:
    0 0 20px var(--glow);
}
.panel{
  position:absolute;
  top:12px;
  width:75px;
  height:50px;
  background:
    repeating-linear-gradient(
      90deg,
      #173d72 0 10px,
      #3264a2 10px 12px
    );
  border:2px solid #8ea8c5;
}
.panel.left{left:-82px}
.panel.right{right:-82px}
.satellite-camera{
  position:absolute;
  left:45px;
  top:17px;
  width:50px;
  height:40px;
  overflow:hidden;
  border-radius:8px;
  background:#101a27;
  border:3px solid #718094;
}
.satellite-camera img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* =========================
   TITLE
========================= */
.title{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  color:white;
  font-size:clamp(22px,4vw,40px);
  font-weight:900;
  letter-spacing:6px;
  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;
  z-index:100;
}
.subtitle{
  position:absolute;
  top:64px;
  width:100%;
  text-align:center;
  color:#91aaff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
}
/* ปุ่ม */
.upload{
  position:absolute;
  right:20px;
  bottom:20px;
  padding:12px 20px;
  border-radius:25px;
  background:#315bd5;
  color:white;
  text-decoration:none;
  z-index:100;
  box-shadow:
    0 0 20px rgba(50,120,255,.6);
}
.mission{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  color:#9db6ff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
  white-space:nowrap;
}
</style>
</head>

  </div>

<script>
/* =========================
   ดาว
========================= */
const space =
  document.getElementById("space");
for(let i=0;i<300;i++){
  const star =
    document.createElement("div");
  star.className="star";
  const size =
    Math.random()*3+1;
  star.style.width=size+"px";
  star.style.height=size+"px";
  star.style.left =
    Math.random()*100+"%";
  star.style.top =
    Math.random()*100+"%";
  star.style.opacity =
    Math.random();
  space.appendChild(star);
}
/* =========================
   ระบบรูป
========================= */
const ships =
  document.getElementById("ships");
let photos=[];
let photoQueue=[];
/*
   แปลงรูปแบบข้อมูล
*/
function getImage(photo){
  if(!photo) return "";
  if(typeof photo === "string"){
    return photo;
  }
  return (
    photo.data ||
    photo.url ||
    photo.image ||
    photo.src ||
    photo.photo ||
    photo.path ||
    ""
  );
}
/*
   หา ID
*/
function getPhotoId(photo,index){
  if(!photo) return String(index);
  return String(
    photo.id ??
    photo._id ??
    photo.createdAt ??
    photo.timestamp ??
    photo.url ??
    photo.data ??
    index
  );
}
/* =========================
   โหลด 10 รูปล่าสุด
========================= */
async function loadPhotos(){
  try{
    const response =
      await fetch(
        "/api/photos?limit=10&_="+Date.now(),
        {
          cache:"no-store"
        }
      );
    if(!response.ok){
      console.log(
        "API status:",
        response.status
      );
      return;
    }
    const data =
      await response.json();
    if(!Array.isArray(data)){
      console.log(
        "API ไม่ได้ส่ง Array:",
        data
      );
      return;
    }
    /*
      เอาเฉพาะ 10 รูปล่าสุด
    */
    photos =
      data
      .filter(photo => getImage(photo))
      .slice(-10);
    /*
      สร้างคิวใหม่เฉพาะรูป
      ที่ยังไม่ได้ถูกใช้
    */
    rebuildQueue();
    console.log(
      "รูปที่โหลดได้:",
      photos.length
    );
  }catch(error){
    console.error(
      "Photo API error:",
      error
    );
  }
}
/* =========================
   สร้าง Queue
========================= */
function rebuildQueue(){
  const activeIds =
    new Set(
      [...document.querySelectorAll(".ship")]
      .map(ship =>
        ship.dataset.photoId
      )
    );
  const queuedIds =
    new Set(photoQueue);
  const available =
    photos.filter(
      (photo,index)=>{
        const id =
          getPhotoId(photo,index);
        return (
          !activeIds.has(id) &&
          !queuedIds.has(id)
        );
      }
    );
  /*
    สุ่มลำดับ
  */
  available.sort(
    ()=>Math.random()-.5
  );
  available.forEach(
    (photo,index)=>{
      photoQueue.push(
        getPhotoId(photo,index)
      );
    }
  );
}
/* =========================
   หา Photo
========================= */
function findPhoto(id){
  return photos.find(
    (photo,index)=>
      getPhotoId(photo,index) ===
      String(id)
  );
}
