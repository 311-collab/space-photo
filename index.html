<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>
<title>SPACE PHOTO MISSION</title>
<style>
*{
  box-sizing:border-box;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #182d65 0%,
      #090f2b 42%,
      #02030a 75%,
      #000 100%
    );
}
/* =========================
   ดาว
========================= */
.star{
  position:absolute;
  border-radius:50%;
  background:white;
  z-index:1;
}
/* =========================
   โลก
========================= */
.earth{
  position:absolute;
  width:230px;
  height:230px;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 28%,
      #d5f8ff 0%,
      #65b3ed 20%,
      #286bc8 45%,
      #102e76 70%,
      #020817 100%
    );
  box-shadow:
    0 0 40px rgba(70,160,255,.8),
    0 0 100px rgba(50,110,255,.35);
  z-index:2;
}
/* =========================
   วงโคจร
========================= */
.orbit{
  position:absolute;
  width:90vw;
  height:45vw;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%)
    rotate(-12deg);
  border:
    1px solid rgba(120,180,255,.2);
  border-radius:50%;
  z-index:1;
}
/* =========================
   พื้นที่ยาน
========================= */
#ships{
  position:absolute;
  inset:0;
  z-index:20;
}
/* =========================
   ยาน
========================= */
.ship{
  position:absolute;
  width:300px;
  height:190px;
  pointer-events:none;
  animation:
    fly var(--speed)
    linear forwards;
  filter:
    drop-shadow(
      0 0 14px
      var(--glow)
    );
}
@keyframes fly{
  0%{
    transform:
      translate(-350px,var(--y1))
      rotate(var(--angle))
      scale(var(--scale));
  }
  50%{
    transform:
      translate(50vw,var(--y2))
      rotate(calc(var(--angle) * -1))
      scale(var(--scale));
  }
  100%{
    transform:
      translate(calc(100vw + 350px),var(--y3))
      rotate(var(--angle))
      scale(var(--scale));
  }
}
/* =====================================================
   UFO
===================================================== */
.ufo{
  position:absolute;
  left:15px;
  top:55px;
  width:230px;
  height:78px;
  border-radius:50%;
  background:
    linear-gradient(
      180deg,
      var(--ufoTop),
      var(--ufoMid) 45%,
      var(--ufoBottom)
    );
  border:
    2px solid rgba(255,255,255,.75);
  box-shadow:
    inset 0 10px 15px
      rgba(255,255,255,.4),
    inset 0 -15px 20px
      rgba(0,0,0,.65),
    0 0 28px
      var(--glow);
}
.ufo::before{
  content:"";
  position:absolute;
  left:-8px;
  top:30px;
  width:246px;
  height:45px;
  border-radius:50%;
  border:
    4px solid var(--rim);
  box-shadow:
    0 0 15px var(--glow);
}
/* โดม */
.dome{
  position:absolute;
  left:72px;
  top:-3px;
  width:86px;
  height:58px;
  overflow:hidden;
  border-radius:
    50% 50% 45% 45%;
  background:
    radial-gradient(
      circle at 30% 20%,
      white,
      var(--glass) 25%,
      #061426 100%
    );
  border:
    3px solid #203752;
  box-shadow:
    0 0 20px var(--glow);
  z-index:5;
}
.dome img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.dome::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.45),
      transparent 45%
    );
  pointer-events:none;
}
/* ไฟ UFO */
.light{
  position:absolute;
  top:69px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--light);
  box-shadow:
    0 0 9px var(--light),
    0 0 22px var(--light);
  animation:
    blink .45s infinite alternate;
}
.light1{left:30px}
.light2{left:75px}
.light3{left:120px}
.light4{left:165px}
@keyframes blink{
  from{
    opacity:.3;
  }
  to{
    opacity:1;
  }
}
/* =====================================================
   ROCKET
===================================================== */
.rocket{
  position:absolute;
  left:70px;
  top:35px;
  width:85px;
  height:145px;
  transform:
    rotate(90deg);
  border-radius:
    50% 50% 38% 38%;
  background:
    linear-gradient(
      90deg,
      #1b2532,
      #eef3f7 35%,
      #8995a4 68%,
      #18212c
    );
  border:
    2px solid rgba(255,255,255,.8);
  box-shadow:
    0 0 25px var(--glow);
}
/* หัวจรวด */
.rocket::before{
  content:"";
  position:absolute;
  left:0;
  top:-36px;
  width:85px;
  height:58px;
  border-radius:
    50% 50% 10% 10%;
  background:
    linear-gradient(
      90deg,
      #303b49,
      #f5f8fa,
      #303b49
    );
}
/* หน้าต่าง */
.rocket-window{
  position:absolute;
  left:18px;
  top:38px;
  width:50px;
  height:50px;
  overflow:hidden;
  border-radius:50%;
  border:
    4px solid #17283c;
  background:#123c65;
  box-shadow:
    0 0 18px var(--glow);
}
.rocket-window img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* ปีก */
.rocket-wing{
  position:absolute;
  width:42px;
  height:52px;
  bottom:14px;
  background:#283545;
  border:
    2px solid #778596;
}
.rocket-wing.left{
  left:-34px;
  transform:
    skewY(-25deg);
}
.rocket-wing.right{
  right:-34px;
  transform:
    skewY(25deg);
}
/* เปลวไฟ */
.rocket-flame{
  position:absolute;
  left:30px;
  bottom:-38px;
  width:25px;
  height:48px;
  border-radius:
    50% 50% 60% 60%;
  background:
    linear-gradient(
      #fff,
      #65d8ff,
      transparent
    );
  filter:
    blur(2px);
  box-shadow:
    0 0 20px #4ccfff;
}
/* =====================================================
   SATELLITE
===================================================== */
.satellite{
  position:absolute;
  left:65px;
  top:60px;
  width:135px;
  height:75px;
  background:
    linear-gradient(
      180deg,
      #c8d2dc,
      #536173
    );
  border-radius:12px;
  border:
    2px solid #e0e8ef;
  box-shadow:
    0 0 22px var(--glow);
}
/* แผงโซลาร์ */
.panel{
  position:absolute;
  top:10px;
  width:75px;
  height:52px;
  background:
    repeating-linear-gradient(
      90deg,
      #173d72 0 10px,
      #3264a2 10px 12px
    );
  border:
    2px solid #9ab0c8;
  box-shadow:
    0 0 8px rgba(70,150,255,.4);
}
.panel.left{
  left:-82px;
}
.panel.right{
  right:-82px;
}
/* กล้อง */
.satellite-camera{
  position:absolute;
  left:43px;
  top:16px;
  width:50px;
  height:42px;
  overflow:hidden;
  border-radius:8px;
  background:#101a27;
  border:
    3px solid #718094;
}
.satellite-camera img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* เสาอากาศ */
.antenna{
  position:absolute;
  width:3px;
  height:30px;
  background:#dce5ed;
  left:66px;
  top:-28px;
}
.antenna::after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  border:
    2px solid #dce5ed;
  left:-5px;
  top:-8px;
}
/* =====================================================
   TITLE
===================================================== */
.title{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  color:white;
  font-size:
    clamp(22px,4vw,40px);
  font-weight:900;
  letter-spacing:6px;
  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;
  z-index:100;
}
.subtitle{
  position:absolute;
  top:64px;
  width:100%;
  text-align:center;
  color:#91aaff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
}
/* =====================================================
   ปุ่ม
===================================================== */
.upload{
  position:absolute;
  right:20px;
  bottom:20px;
  padding:12px 20px;
  border-radius:25px;
  background:#315bd5;
  color:white;
  text-decoration:none;
  z-index:100;
  box-shadow:
    0 0 20px rgba(50,120,255,.6);
}
/* =====================================================
   ข้อความ
===================================================== */
.mission{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:
    translateX(-50%);
  color:#9db6ff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
  white-space:nowrap;
}
</style>
</head>
<body>
<div id="space">
  <div class="title">
    SPACE PHOTO
  </div>
  <div class="subtitle">
    ALIEN UFO • ROCKET • SATELLITE MISSION
  </div>
  <div class="orbit"></div>
  <div class="earth"></div>
  <div id="ships"></div>
  <div class="mission">
    🛸 🚀 🛰️ INFINITE SPACE MISSION
  </div>
  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>
</div>
<script>
/* =====================================================
   ดาว
===================================================== */
const space =
  document.getElementById("space");
for(let i=0;i<300;i++){
  const star =
    document.createElement("div");
  star.className="star";
  const size =
    Math.random()*3+1;
  star.style.width =
    size+"px";
  star.style.height =
    size+"px";
  star.style.left =
    Math.random()*100+"%";
  star.style.top =
    Math.random()*100+"%";
  star.style.opacity =
    Math.random();
  space.appendChild(star);
}
/* =====================================================
   ระบบยาน
===================================================== */
const ships =
  document.getElementById("ships");
let photos=[];
/*
  คิวรูป
  สำคัญ:
  รูปหนึ่งรูปจะถูกใช้เพียงครั้งเดียว
  ต่อหนึ่งรอบ
*/
let photoQueue=[];
/*
  รูปที่ใช้ในรอบปัจจุบัน
*/
let usedIndexes=new Set();
/* =====================================================
   โหลดรูปจาก API เดิม
===================================================== */
async function loadPhotos(){
  try{
    const response =
      await fetch("/api/photos");
    if(!response.ok){
      console.log(
        "API error:",
        response.status
      );
      return;
    }
    const data =
      await response.json();
    /*
      ตรงนี้ใช้รูปแบบเดียวกับ
      index.html ตัวเดิมของคุณ
    */
    if(Array.isArray(data)){
      photos=data;
    }
    /*
      ถ้ามีรูปเข้ามาใหม่
      ให้เพิ่ม
