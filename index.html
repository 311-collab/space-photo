<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE PHOTO MISSION</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at center,
      #142451 0%,
      #080d20 40%,
      #02030a 75%,
      #000 100%
    );
}


/* =========================
   STARS
========================= */

.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  z-index:1;
}


/* =========================
   EARTH
========================= */

.earth{
  position:absolute;

  width:260px;
  height:260px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #b9efff,
      #4b9be8 25%,
      #1e55ae 50%,
      #081a4a 75%,
      #01030c 100%
    );

  box-shadow:
    0 0 40px rgba(70,150,255,.8),
    0 0 100px rgba(50,100,255,.35);

  z-index:2;
}


/* =========================
   ORBIT
========================= */

.orbit{
  position:absolute;

  width:90vw;
  height:45vw;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  border:
    1px solid
    rgba(100,170,255,.2);

  border-radius:50%;

  z-index:1;
}


/* =========================
   TITLE
========================= */

.title{
  position:absolute;

  top:22px;

  width:100%;

  text-align:center;

  color:#fff;

  font-size:
    clamp(22px,4vw,40px);

  font-weight:bold;

  letter-spacing:6px;

  text-shadow:
    0 0 15px #4d9cff,
    0 0 35px #2360db;

  z-index:100;
}

.subtitle{
  position:absolute;

  top:68px;

  width:100%;

  text-align:center;

  color:#91adff;

  font-size:12px;

  letter-spacing:4px;

  z-index:100;
}


/* =========================
   SPACECRAFT
========================= */

#ships{
  position:absolute;
  inset:0;
  z-index:20;
}

.ship{

  position:absolute;

  width:720px;
  height:360px;

  animation:
    fly
    var(--speed)
    linear
    infinite;

  filter:
    drop-shadow(
      0 15px 25px
      rgba(0,0,0,.7)
    )
    drop-shadow(
      0 0 25px
      rgba(70,150,255,.5)
    );
}


/* =========================
   REALISTIC SHIP
========================= */

.spacecraft{

  position:absolute;

  left:100px;
  top:90px;

  width:520px;
  height:170px;

  border-radius:
    48% 55% 45% 48%;

  background:

    linear-gradient(
      180deg,
      #dfe7ef 0%,
      #8796a8 35%,
      #3d4a5c 65%,
      #111925 100%
    );

  border:
    2px solid
    rgba(255,255,255,.5);

  box-shadow:

    inset
    0 15px 20px
    rgba(255,255,255,.3),

    inset
    0 -25px 30px
    rgba(0,0,0,.55),

    0 0 25px
    rgba(70,140,255,.25);

  transform:
    perspective(800px)
    rotateY(-8deg)
    rotateX(4deg);
}


/* =========================
   METAL PANELS
========================= */

.panel1,
.panel2,
.panel3{

  position:absolute;

  height:2px;

  background:
    rgba(20,30,45,.5);

}

.panel1{
  left:40px;
  top:42px;
  width:370px;
}

.panel2{
  left:55px;
  top:125px;
  width:330px;
}

.panel3{
  left:250px;
  top:15px;
  width:2px;
  height:140px;
}


/* =========================
   REALISTIC WINDOW
========================= */

.window{

  position:absolute;

  left:180px;
  top:24px;

  width:190px;
  height:120px;

  border-radius:
    50%;

  overflow:hidden;

  background:#020711;

  border:
    10px solid
    #172131;

  box-shadow:

    0 0 0 3px
    #56677c,

    0 0 20px
    rgba(60,160,255,.7),

    inset
    0 0 25px
    #000;

  z-index:10;
}


/* =========================
   USER PHOTO
========================= */

.window img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}


/* =========================
   GLASS REFLECTION
========================= */

.glass{

  position:absolute;

  left:188px;
  top:30px;

  width:175px;
  height:105px;

  border-radius:50%;

  background:

    linear-gradient(
      130deg,
      rgba(255,255,255,.38),
      transparent 35%
    );

  z-index:11;

  pointer-events:none;
}


/* =========================
   COCKPIT FRAME
========================= */

.frame{

  position:absolute;

  left:170px;
  top:15px;

  width:210px;
  height:140px;

  border-radius:50%;

  border:
    3px solid
    rgba(130,160,190,.8);

  pointer-events:none;

  z-index:12;
}


/* =========================
   WINGS
========================= */

.wingTop{

  position:absolute;

  left:110px;
  top:-75px;

  width:230px;
  height:95px;

  background:

    linear-gradient(
      135deg,
      #68798d,
      #182130
    );

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      70% 0
    );

}

.wingBottom{

  position:absolute;

  left:110px;
  bottom:-75px;

  width:230px;
  height:95px;

  background:

    linear-gradient(
      45deg,
      #68798d,
      #182130
    );

  clip-path:
    polygon(
      0 0,
      100% 0,
      70% 100%
    );

}


/* =========================
   ENGINE
========================= */

.engine{

  position:absolute;

  left:-55px;
  top:47px;

  width:80px;
  height:75px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      #b9c8d8 0%,
      #425269 35%,
      #111827 70%
    );

  box-shadow:
    inset 0 0 15px #000;
}


/* =========================
   ENGINE LIGHT
========================= */

.engineGlow{

  position:absolute;

  left:-170px;
  top:70px;

  width:150px;
  height:40px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #1765ff,
      #6edfff,
      #fff
    );

  clip-path:
    polygon(
      0 50%,
      70% 0,
      100% 50%,
      70% 100%
    );

  filter:blur(4px);

  animation:
    enginePulse
    .12s
    infinite
    alternate;
}

@keyframes enginePulse{

  from{
    transform:scaleX(.65);
    opacity:.6;
  }

  to{
    transform:scaleX(1.2);
    opacity:1;
  }
}


/* =========================
   FRONT
========================= */

.front{

  position:absolute;

  right:-110px;
  top:10px;

  width:140px;
  height:150px;

  background:

    linear-gradient(
      135deg,
      #e9eef4,
      #8998aa,
      #354256
    );

  clip-path:
    polygon(
      0 0,
      100% 50%,
      0 100%
    );

}


/* =========================
   FRONT LIGHT
========================= */

.frontLight{

  position:absolute;

  right:-115px;
  top:67px;

  width:16px;
  height:30px;

  border-radius:50%;

  background:#7ee4ff;

  box-shadow:
    0 0 15px #65d5ff,
    0 0 35px #3d8cff;
}


/* =========================
   FLIGHT
========================= */

@keyframes fly{

  0%{

    transform:
      translate(
        -800px,
        var(--y1)
      )
      rotate(-4deg)
      scale(.85);

  }

  25%{

    transform:
      translate(
        18vw,
        var(--y2)
      )
      rotate(2deg)
      scale(1);

  }

  50%{

    transform:
      translate(
        45vw,
        var(--y3)
      )
      rotate(-2deg)
      scale(1.08);

  }

  75%{

    transform:
      translate(
        72vw,
        var(--y2)
      )
      rotate(3deg)
      scale(1);

  }

  100%{

    transform:
      translate(
        calc(100vw + 800px),
        var(--y1)
      )
      rotate(-3deg)
      scale(.85);

  }

}


/* =========================
   BOTTOM
========================= */

.mission{

  position:absolute;

  bottom:22px;

  left:50%;

  transform:
    translateX(-50%);

  color:#9bb4ff;

  font-size:12px;

  letter-spacing:4px;

  z-index:100;

  white-space:nowrap;
}


/* =========================
   UPLOAD
========================= */

.upload{

  position:absolute;

  right:25px;
  bottom:18px;

  padding:
    13px 22px;

  border-radius:30px;

  background:
    rgba(35,85,200,.9);

  color:#fff;

  text-decoration:none;

  z-index:100;

  box-shadow:
    0 0 20px
    rgba(50,120,255,.5);
}

</style>
</head>


<body>

<div id="space">

  <div class="title">
    SPACE PHOTO
  </div>

  <div class="subtitle">
    EVERY PHOTO • A NEW SPACE MISSION
  </div>

  <div class="orbit"></div>

  <div class="earth"></div>

  <div id="ships"></div>

  <div class="mission">
    🛰️ SPACE EXPLORATION MISSION
  </div>

  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>

</div>


<script>

/* =========================
   STARS
========================= */

const space =
  document.getElementById(
    "space"
  );

for(let i=0;i<300;i++){

  const star =
    document.createElement(
      "div"
    );

  star.className="star";

  const size =
    Math.random()*3+1;

  star.style.width=
    size+"px";

  star.style.height=
    size+"px";

  star.style.left=
    Math.random()*100+"%";

  star.style.top=
    Math.random()*100+"%";

  star.style.opacity=
    Math.random();

  space.appendChild(star);
}


/* =========================
   SHIPS
========================= */

const ships =
  document.getElementById(
    "ships"
  );

const shown =
  new Set();


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos(){

  try{

    const response =
      await fetch(
        "/api/photos"
      );

    const photos =
      await response.json();


    photos.forEach(
      photo=>{

        if(
          shown.has(
            photo.id
          )
        ){
          return;
        }

        shown.add(
          photo.id
        );

        createShip(
          photo
        );

      }
    );

  }catch(error){

    console.log(
      "Photo loading error",
      error
    );

  }
}

   CREATE SHIP
========================= */

  ship.className="ship";

    (18+Math.random()*10)+"s"
  );
