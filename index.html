<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE ROCKET MISSION</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#space {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #111a3d 0%,
      #050817 45%,
      #000 100%
    );
}

/* =========================
   ดาว
========================= */

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  pointer-events: none;
}

/* =========================
   หัวเรื่อง
========================= */

.title {
  position: absolute;
  top: 22px;
  left: 0;
  width: 100%;

  text-align: center;

  color: white;
  font-size: clamp(20px, 4vw, 32px);
  font-weight: bold;
  letter-spacing: 5px;

  text-shadow:
    0 0 10px #568cff,
    0 0 30px #3159d9;

  z-index: 100;
}

.subtitle {
  position: absolute;
  top: 65px;
  left: 0;
  width: 100%;

  text-align: center;

  color: #91a9ff;
  font-size: 12px;
  letter-spacing: 4px;

  z-index: 100;
}

/* =========================
   โลก
========================= */

.earth {

  position: absolute;

  width: 220px;
  height: 220px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #8bd7ff 0%,
      #3976d8 28%,
      #163b91 55%,
      #07102d 80%,
      #02040c 100%
    );

  box-shadow:
    0 0 35px rgba(70,150,255,.7),
    0 0 100px rgba(40,100,255,.35);

  z-index: 2;
}

/* แสงรอบโลก */

.earth::after {

  content: "";

  position: absolute;

  inset: -12px;

  border-radius: 50%;

  border: 2px solid rgba(100,180,255,.15);

  box-shadow:
    0 0 35px rgba(70,150,255,.2);

}

/* =========================
   เส้นวงโคจร
========================= */

.orbit {

  position: absolute;

  width: 75vw;
  height: 38vw;

  max-width: 1100px;
  max-height: 500px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-10deg);

  border:
    1px solid rgba(100,160,255,.18);

  border-radius: 50%;

  z-index: 1;
}

/* =========================
   ชั้นจรวด
========================= */

#rockets {
  position: absolute;
  inset: 0;

  z-index: 20;
}

/* =========================
   จรวด
========================= */

.rocket {

  position: absolute;

  width: 380px;
  height: 180px;

  display: flex;
  align-items: center;

  animation:
    rocketFlight
    var(--duration)
    linear
    infinite;

  filter:
    drop-shadow(
      0 0 12px
      rgba(80,150,255,.7)
    );

}

/* =========================
   ตัวจรวด
========================= */

.body {

  position: relative;

  width: 270px;
  height: 105px;

  border-radius:
    50px
    18px
    18px
    50px;

  background:
    linear-gradient(
      to bottom,
      #f4f7ff,
      #9ca9c8
    );

  border:
    2px solid rgba(255,255,255,.8);

  box-shadow:
    inset 0 -8px 15px rgba(0,0,0,.25);

}

/* =========================
   หัวจรวด
========================= */

.nose {

  position: absolute;

  right: -35px;
  top: 0;

  width: 55px;
  height: 58px;

  background:
    linear-gradient(
      to right,
      #dce6ff,
      #ffffff
    );

  clip-path:
    polygon(
      0 0,
      100% 50%,
      0 100%
    );

}

/* =========================
   หน้าต่างรูปภาพ
========================= */

.photoWindow {

  position: absolute;

  left: 65px;
  top: 15px;

  width: 105px;
  height: 75px;

  border-radius: 8px;

  overflow: hidden;

  border:
    3px solid #202b50;

  background: #050817;

  box-shadow:
    0 0 10px
    rgba(80,150,255,.8);

}

.photoWindow img {

  width: 100%;
  height: 100%;

  object-fit: cover;

}

/* =========================
   ปีก
========================= */

.wing {

  position: absolute;

  width: 38px;
  height: 30px;

  background:
    linear-gradient(
      135deg,
      #53658e,
      #18223f
    );

}

.wing.top {

  left: 18px;
  top: -18px;

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      40% 0
    );

}

.wing.bottom {

  left: 18px;
  bottom: -18px;

  clip-path:
    polygon(
      0 0,
      100% 0,
      40% 100%
    );

}

/* =========================
   เครื่องยนต์
========================= */

.engine {

  position: absolute;

  left: -18px;
  top: 17px;

  width: 28px;
  height: 24px;

  background: #202a47;

  border-radius: 8px;

}

/* =========================
   เปลวไฟ
========================= */

.flame {

  position: absolute;

  left: -75px;
  top: 12px;

  width: 75px;
  height: 35px;

  background:
    linear-gradient(
      to left,
      #fff,
      #6fd8ff,
      #397aff,
      transparent
    );

  clip-path:
    polygon(
      100% 50%,
      65% 15%,
      0 50%,
      65% 85%
    );

  animation:
    flame
    .15s
    infinite
    alternate;

}

@keyframes flame {

  from {
    transform: scaleX(.7);
    opacity: .7;
  }

  to {
    transform: scaleX(1.15);
    opacity: 1;
  }

}

/* =========================
   จรวดบิน
========================= */

@keyframes rocketFlight {

  0% {

    transform:
      translateX(-300px)
      translateY(var(--startY))
      rotate(-3deg);

  }

  25% {

    transform:
      translateX(25vw)
      translateY(var(--midY))
      rotate(2deg);

  }

  50% {

    transform:
      translateX(50vw)
      translateY(var(--endY))
      rotate(-2deg);

  }

  75% {

    transform:
      translateX(75vw)
      translateY(var(--midY))
      rotate(3deg);

  }

  100% {

    transform:
      translateX(calc(100vw + 300px))
      translateY(var(--startY))
      rotate(-2deg);

  }

}

/* =========================
   ข้อมูล
========================= */

.mission {

  position: absolute;

  bottom: 25px;
  left: 50%;

  transform:
    translateX(-50%);

  color: #8fa9ff;

  font-size: 11px;
  letter-spacing: 3px;

  z-index: 100;

  white-space: nowrap;

}

.upload {

  position: absolute;

  right: 20px;
  bottom: 20px;

  padding:
    12px 20px;

  border-radius: 25px;

  background:
    rgba(40,80,190,.8);

  color: white;

  text-decoration: none;

  z-index: 100;

  box-shadow:
    0 0 20px
    rgba(50,100,255,.5);

}

</style>
</head>

<body>

<div id="space">

  <div class="title">
    SPACE ROCKET
  </div>

  <div class="subtitle">
    DIGITAL SPACE MISSION
  </div>

  <div class="orbit"></div>

  <div class="earth"></div>

  <div id="rockets"></div>

  <div class="mission">
    EVERY PHOTO • A NEW SPACE MISSION
  </div>

  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD
  </a>

</div>


<script>

/* =========================
   สร้างดาว
========================= */

const space =
  document.getElementById("space");

for (let i = 0; i < 220; i++) {

  const star =
    document.createElement("div");

  star.className =
    "star";

  const size =
    Math.random() * 3 + 1;

  star.style.width =
    size + "px";

  star.style.height =
    size + "px";

  star.style.left =
    Math.random() * 100 + "%";

  star.style.top =
    Math.random() * 100 + "%";

  star.style.opacity =
    Math.random();

  space.appendChild(star);

}


/* =========================
   ระบบจรวด
========================= */

const rockets =
  document.getElementById("rockets");

const shown =
  new Set();


/* =========================
   โหลดรูป
========================= */

async function loadPhotos() {

  try {

    const response =
      await fetch("/api/photos");

    const photos =
      await response.json();

    photos.forEach(photo => {

      if (shown.has(photo.id)) {
        return;
      }

      shown.add(photo.id);

      createRocket(photo);

    });

  }

  catch (error) {

    console.log(
      "ไม่สามารถโหลดรูป",
      error
    );

  }

}


/* =========================
   สร้างจรวด
========================= */

function createRocket(photo) {

  const rocket =
    document.createElement("div");

  rocket.className =
    "rocket";


  /* ความเร็วแต่ละลำ */

  const duration =
    10 + Math.random() * 10;

  rocket.style.setProperty(
    "--duration",
    duration + "s"
  );


  /* เส้นทางการบิน */

  rocket.style.setProperty(
    "--startY",
    (10 + Math.random() * 70) + "vh"
  );

  rocket.style.setProperty(
    "--midY",
    (15 + Math.random() * 60) + "vh"
  );

  rocket.style.setProperty(
    "--endY",
    (10 + Math.random() * 70) + "vh"
  );


  rocket.innerHTML = `

    <div class="flame"></div>

    <div class="body">

      <div class="engine"></div>

      <div class="wing top"></div>

      <div class="wing bottom"></div>

      <div class="photoWindow">

        <img
          src="${photo.data}"
          alt="Space Photo"
        >

      </div>

      <div class="nose"></div>

    </div>

  `;


  rockets.appendChild(
    rocket
  );

}


/* =========================
   โหลดครั้งแรก
========================= */

loadPhotos();


/* =========================
   ตรวจรูปใหม่
========================= */

setInterval(
  loadPhotos,
  3000
);

</script>

</body>
</html>
