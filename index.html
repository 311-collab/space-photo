<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIG SPACE ROCKET</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#space {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #14204a 0%,
      #060a1d 45%,
      #000 100%
    );
}


/* =========================
   ดาว
========================= */

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
}


/* =========================
   TITLE
========================= */

.title {
  position: absolute;
  top: 20px;
  left: 0;
  width: 100%;

  text-align: center;

  color: white;

  font-size: clamp(24px, 5vw, 42px);

  font-weight: bold;

  letter-spacing: 6px;

  text-shadow:
    0 0 15px #568cff,
    0 0 35px #3159d9;

  z-index: 100;
}


.subtitle {

  position: absolute;

  top: 70px;

  width: 100%;

  text-align: center;

  color: #9ab0ff;

  font-size: 13px;

  letter-spacing: 5px;

  z-index: 100;
}


/* =========================
   EARTH
========================= */

.earth {

  position: absolute;

  width: 260px;
  height: 260px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 35% 30%,
      #9be3ff 0%,
      #4b8fe8 25%,
      #17449e 50%,
      #071432 75%,
      #02040c 100%
    );

  box-shadow:

    0 0 45px
    rgba(80,160,255,.75),

    0 0 120px
    rgba(50,100,255,.35);

  z-index: 2;
}


/* =========================
   ORBIT
========================= */

.orbit {

  position: absolute;

  width: 85vw;
  height: 42vw;

  max-width: 1300px;
  max-height: 600px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-10deg);

  border:
    1px solid
    rgba(120,170,255,.2);

  border-radius: 50%;

  z-index: 1;
}


/* =========================
   ROCKET CONTAINER
========================= */

#rockets {

  position: absolute;

  inset: 0;

  z-index: 20;

}


/* =========================
   BIG ROCKET
========================= */

.rocket {

  position: absolute;

  width: 560px;
  height: 260px;

  display: flex;

  align-items: center;

  animation:

    rocketFlight
    var(--duration)
    linear
    infinite;

  filter:

    drop-shadow(
      0 0 20px
      rgba(80,160,255,.8)
    );

}


/* =========================
   ROCKET BODY
========================= */

.body {

  position: relative;

  width: 400px;
  height: 150px;

  border-radius:

    80px
    35px
    35px
    80px;

  background:

    linear-gradient(
      to bottom,
      #ffffff 0%,
      #dbe3f4 45%,
      #8e9bb5 100%
    );

  border:

    3px solid
    rgba(255,255,255,.9);

  box-shadow:

    inset
    0 -20px
    30px
    rgba(0,0,0,.25),

    0 0 30px
    rgba(100,160,255,.4);

}


/* =========================
   NOSE
========================= */

.nose {

  position: absolute;

  right: -75px;

  top: 0;

  width: 100px;

  height: 150px;

  background:

    linear-gradient(
      to right,
      #dce7ff,
      #ffffff
    );

  clip-path:

    polygon(
      0 0,
      100% 50%,
      0 100%
    );

}


/* =========================
   BIG PHOTO WINDOW
========================= */

.photoWindow {

  position: absolute;

  left: 95px;

  top: 25px;

  width: 190px;

  height: 100px;

  border-radius: 18px;

  overflow: hidden;

  background: #030713;

  border:

    6px solid
    #182343;

  box-shadow:

    0 0 20px
    rgba(80,170,255,.9),

    inset 0 0 15px
    rgba(0,0,0,.7);

}


.photoWindow img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

}


/* =========================
   PHOTO LABEL
========================= */

.photoLabel {

  position: absolute;

  left: 95px;

  top: 130px;

  width: 190px;

  text-align: center;

  color: #1b2c54;

  font-size: 13px;

  font-weight: bold;

  letter-spacing: 2px;

}


/* =========================
   WINGS
========================= */

.wing {

  position: absolute;

  width: 95px;

  height: 80px;

  background:

    linear-gradient(
      135deg,
      #667799,
      #182441
    );

}


.wing.top {

  left: 45px;

  top: -65px;

  clip-path:

    polygon(
      0 100%,
      100% 100%,
      40% 0
    );

}


.wing.bottom {

  left: 45px;

  bottom: -65px;

  clip-path:

    polygon(
      0 0,
      100% 0,
      40% 100%
    );

}


/* =========================
   ENGINE
========================= */

.engine {

  position: absolute;

  left: -35px;

  top: 42px;

  width: 55px;

  height: 65px;

  background:

    linear-gradient(
      to right,
      #141b31,
      #3b4a6c
    );

  border-radius: 15px;

}


/* =========================
   FLAME
========================= */

.flame {

  position: absolute;

  left: -180px;

  top: 35px;

  width: 180px;

  height: 80px;

  background:

    linear-gradient(
      to left,
      #ffffff,
      #65dfff,
      #397aff,
      transparent
    );

  clip-path:

    polygon(
      100% 50%,
      65% 10%,
      0 50%,
      65% 90%
    );

  animation:

    flame
    .15s
    infinite
    alternate;

}


@keyframes flame {

  from {

    transform:
      scaleX(.65);

    opacity: .7;

  }

  to {

    transform:
      scaleX(1.15);

    opacity: 1;

  }

}


/* =========================
   ROCKET FLIGHT
========================= */

@keyframes rocketFlight {

  0% {

    transform:

      translateX(-650px)

      translateY(
        var(--startY)
      )

      rotate(-4deg);

  }

  25% {

    transform:

      translateX(20vw)

      translateY(
        var(--midY)
      )

      rotate(3deg);

  }

  50% {

    transform:

      translateX(45vw)

      translateY(
        var(--endY)
      )

      rotate(-3deg);

  }

  75% {

    transform:

      translateX(70vw)

      translateY(
        var(--midY)
      )

      rotate(3deg);

  }

  100% {

    transform:

      translateX(
        calc(100vw + 650px)
      )

      translateY(
        var(--startY)
      )

      rotate(-3deg);

  }

}


/* =========================
   MISSION
========================= */

.mission {

  position: absolute;

  bottom: 25px;

  left: 50%;

  transform:
    translateX(-50%);

  color: #9ab0ff;

  font-size: 12px;

  letter-spacing: 4px;

  white-space: nowrap;

  z-index: 100;

}


/* =========================
   UPLOAD BUTTON
========================= */

.upload {

  position: absolute;

  right: 25px;

  bottom: 20px;

  padding:
    14px 25px;

  border-radius: 30px;

  background:

    rgba(40,90,210,.85);

  color: white;

  text-decoration: none;

  font-size: 15px;

  z-index: 100;

  box-shadow:

    0 0 25px
    rgba(50,120,255,.6);

}

</style>
</head>


<body>

<div id="space">

  <div class="title">
    SPACE ROCKET
  </div>

  <div class="subtitle">
    DIGITAL SPACE PHOTO MISSION
  </div>


  <div class="orbit"></div>


  <div class="earth"></div>


  <div id="rockets"></div>


  <div class="mission">
    EVERY PHOTO • A NEW SPACE MISSION
  </div>


  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>

</div>


<script>


/* =========================
   CREATE STARS
========================= */

const space =
  document.getElementById(
    "space"
  );


for (
  let i = 0;
  i < 250;
  i++
) {

  const star =
    document.createElement(
      "div"
    );

  star.className =
    "star";


  const size =
    Math.random() * 3 + 1;


  star.style.width =
    size + "px";


  star.style.height =
    size + "px";


  star.style.left =
    Math.random() * 100 + "%";


  star.style.top =
    Math.random() * 100 + "%";


  star.style.opacity =
    Math.random();


  space.appendChild(
    star
  );

}


/* =========================
   ROCKET SYSTEM
========================= */

const rockets =
  document.getElementById(
    "rockets"
  );


const shown =
  new Set();


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos() {

  try {

    const response =
      await fetch(
        "/api/photos"
      );


    const photos =
      await response.json();


    photos.forEach(
      photo => {

        if (
          shown.has(
            photo.id
          )
        ) {

          return;

        }


        shown.add(
          photo.id
        );


        createRocket(
          photo
        );

      }
    );

  }

  catch (error) {

    console.log(
      "Photo loading error",
      error
    );

  }

}


/* =========================
   CREATE ROCKET
========================= */

function createRocket(
  photo
) {

  const rocket =
    document.createElement(
      "div"
    );


  rocket.className =
    "rocket";


  /* ความเร็ว */

  const duration =
    18 +
    Math.random() * 10;


  rocket.style.setProperty(
    "--duration",
    duration + "s"
  );


  /* เส้นทาง */

  rocket.style.setProperty(

    "--startY",

    (
      8 +
      Math.random() * 75
    ) + "vh"

  );


  rocket.style.setProperty(

    "--midY",

    (
      10 +
      Math.random() * 70
    ) + "vh"

  );


  rocket.style.setProperty(

    "--endY",

    (
      8 +
      Math.random() * 75
    ) + "vh"

  );


  rocket.innerHTML = `

    <div class="flame"></div>

    <div class="body">

      <div class="engine"></div>

      <div class="wing top"></div>

      <div class="wing bottom"></div>

      <div class="photoWindow">

        <img
          src="${photo.data}"
          alt="Space Photo"
        >

      </div>

      <div class="photoLabel">
        SPACE MISSION
      </div>

      <div class="nose"></div>

    </div>

  `;


  rockets.appendChild(
    rocket
  );

}


/* =========================
   START
========================= */

loadPhotos();

   CHECK NEW PHOTOS
=================
