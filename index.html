<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE PHOTO MISSION</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01030a;
  font-family:Arial,sans-serif;
}

#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #18295d 0%,
      #080e2b 35%,
      #02040d 72%,
      #000 100%
    );
}


/* =========================
   TITLE
========================= */

.title{
  position:absolute;
  top:22px;
  width:100%;

  text-align:center;

  color:#fff;

  font-size:
    clamp(24px,4vw,42px);

  font-weight:900;

  letter-spacing:7px;

  text-shadow:
    0 0 12px #65a9ff,
    0 0 35px #3679ff,
    0 0 70px #1c45bd;

  z-index:100;
}

.subtitle{
  position:absolute;
  top:70px;
  width:100%;

  text-align:center;

  color:#91adff;

  font-size:12px;

  letter-spacing:5px;

  z-index:100;
}


/* =========================
   STARS
========================= */

.star{
  position:absolute;

  background:white;

  border-radius:50%;

  pointer-events:none;
}


/* =========================
   EARTH
========================= */

.earth{

  position:absolute;

  width:250px;
  height:250px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:

    radial-gradient(
      circle at 30% 25%,
      #c5f1ff 0%,
      #65a9ee 18%,
      #2864c5 40%,
      #102f7d 65%,
      #03091f 90%
    );

  box-shadow:

    0 0 35px
    rgba(80,160,255,.8),

    0 0 100px
    rgba(50,110,255,.4),

    0 0 180px
    rgba(30,70,255,.2);

  z-index:2;
}


/* =========================
   ORBIT
========================= */

.orbit{

  position:absolute;

  width:90vw;
  height:43vw;

  max-width:1400px;
  max-height:650px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  border:
    1px solid
    rgba(110,180,255,.2);

  border-radius:50%;

  box-shadow:
    0 0 40px
    rgba(80,140,255,.08);

  z-index:1;
}


/* =========================
   SPACECRAFT AREA
========================= */

#ships{

  position:absolute;

  inset:0;

  z-index:30;
}


/* =========================
   SPACECRAFT
========================= */

.ship{

  position:absolute;

  width:720px;
  height:360px;

  animation:
    cruise
    var(--duration)
    linear
    infinite;

  transform-style:preserve-3d;

  filter:
    drop-shadow(
      0 0 20px
      rgba(60,160,255,.8)
    );

}


/* =========================
   MAIN BODY
========================= */

.craft{

  position:absolute;

  left:90px;
  top:105px;

  width:500px;
  height:135px;

  border-radius:
    70px 110px 110px 70px;

  background:

    linear-gradient(
      180deg,
      #eef5ff 0%,
      #b9c9df 35%,
      #657793 70%,
      #293754 100%
    );

  border:
    3px solid
    rgba(255,255,255,.8);

  box-shadow:

    inset 0 -25px 35px
    rgba(10,20,45,.45),

    inset 20px 0 30px
    rgba(255,255,255,.35),

    0 0 30px
    rgba(70,150,255,.45);

  transform:
    rotateX(8deg)
    rotateY(-8deg);

}


/* =========================
   TOP FIN
========================= */

.topWing{

  position:absolute;

  left:105px;
  top:-78px;

  width:210px;
  height:95px;

  background:

    linear-gradient(
      135deg,
      #62789b,
      #16213c
    );

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      68% 0
    );

}


/* =========================
   BOTTOM FIN
========================= */

.bottomWing{

  position:absolute;

  left:105px;
  bottom:-78px;

  width:210px;
  height:95px;

  background:

    linear-gradient(
      45deg,
      #62789b,
      #16213c
    );

  clip-path:
    polygon(
      0 0,
      100% 0,
      68% 100%
    );

}


/* =========================
   SIDE WINGS
========================= */

.sideWing{

  position:absolute;

  left:185px;
  top:35px;

  width:300px;
  height:65px;

  background:

    linear-gradient(
      90deg,
      #293b5d,
      #8194b2,
      #273754
    );

  clip-path:
    polygon(
      0 50%,
      100% 0,
      78% 100%
    );

  opacity:.9;
}


/* =========================
   BIG PHOTO WINDOW
========================= */

.photo{

  position:absolute;

  left:190px;
  top:15px;

  width:175px;
  height:105px;

  border-radius:50%;

  overflow:hidden;

  background:#020713;

  border:
    9px solid
    #182b50;

  box-shadow:

    0 0 0 4px
    rgba(100,180,255,.3),

    0 0 30px
    rgba(60,170,255,.9),

    inset 0 0 20px #000;

  z-index:5;
}

.photo img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* =========================
   WINDOW REFLECTION
========================= */

.reflection{

  position:absolute;

  left:200px;
  top:23px;

  width:150px;
  height:85px;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      rgba(255,255,255,.35),
      transparent 45%
    );

  pointer-events:none;

  z-index:6;
}


/* =========================
   FRONT NOSE
========================= */

.front{

  position:absolute;

  right:-135px;
  top:0;

  width:170px;
  height:135px;

  background:

    linear-gradient(
      135deg,
      #ffffff,
      #c8d6e9,
      #61748f
    );

  clip-path:
    polygon(
      0 0,
      100% 50%,
      0 100%
    );

}


/* =========================
   FRONT LIGHT
========================= */

.frontLight{

  position:absolute;

  right:-145px;
  top:48px;

  width:20px;
  height:38px;

  border-radius:50%;

  background:#8de5ff;

  box-shadow:

    0 0 15px #65d0ff,
    0 0 40px #3b8cff;

}


/* =========================
   REAR ENGINE
========================= */

.engine{

  position:absolute;

  left:25px;
  top:25px;

  width:70px;
  height:85px;

  border-radius:20px;

  background:

    radial-gradient(
      circle,
      #7190b8 0%,
      #273754 45%,
      #090f20 100%
    );

  box-shadow:
    inset 0 0 15px #000;

}


/* =========================
   ENGINE RING
========================= */

.engineRing{

  position:absolute;

  left:34px;
  top:34px;

  width:52px;
  height:68px;

  border:
    6px solid
    #3b5375;

  border-radius:50%;

}


/* =========================
   ENGINE GLOW
========================= */

.engineGlow{

  position:absolute;

  left:-110px;
  top:47px;

  width:130px;
  height:45px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #2670ff,
      #62ddff,
      #fff
    );

  clip-path:

    polygon(
      0 50%,
      65% 0,
      100% 50%,
      65% 100%
    );

  filter:
    blur(4px);

  animation:
    enginePulse
    .15s
    infinite
    alternate;

}

@keyframes enginePulse{

  from{
    transform:scaleX(.7);
    opacity:.65;
  }

  to{
    transform:scaleX(1.2);
    opacity:1;
  }

}


/* =========================
   ENERGY LINES
========================= */

.energy{

  position:absolute;

  left:105px;
  top:125px;

  width:450px;
  height:4px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #4ccfff,
      transparent
    );

  box-shadow:

    0 0 12px
    #48c9ff;

  opacity:.8;

}


/* =========================
   FLIGHT
========================= */

@keyframes cruise{

  0%{

    transform:

      translate(
        -800px,
        var(--y1)
      )

      rotate(-5deg)
      scale(.9);

  }

  25%{

    transform:

      translate(
        18vw,
        var(--y2)
      )

      rotate(3deg)
      scale(1);

  }

  50%{

    transform:

      translate(
        45vw,
        var(--y3)
      )

      rotate(-3deg)
      scale(1.08);

  }

  75%{

    transform:

      translate(
        72vw,
        var(--y2)
      )

      rotate(4deg)
      scale(1);

  }

  100%{

    transform:

      translate(
        calc(100vw + 800px),
        var(--y1)
      )

      rotate(-4deg)
      scale(.9);

  }

}


/* =========================
   MISSION
========================= */

.mission{

  position:absolute;

  bottom:25px;

  left:50%;

  transform:
    translateX(-50%);

  color:#9db6ff;

  font-size:12px;

  letter-spacing:4px;

  white-space:nowrap;

  z-index:100;
}


/* =========================
   UPLOAD BUTTON
========================= */

.upload{

  position:absolute;

  right:25px;
  bottom:20px;

  padding:
    14px 25px;

  border-radius:30px;

  background:
    rgba(42,92,210,.9);

  color:white;

  text-decoration:none;

  font-size:14px;

  z-index:100;

  box-shadow:
    0 0 25px
    rgba(50,120,255,.6);

}

</style>
</head>

  </a>

</div>
