<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alien Space Mission</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #172b61 0%,
      #090f2c 38%,
      #02030b 75%,
      #000 100%
    );
}


/* =========================
   ดาว
========================= */

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  z-index:1;
}


/* =========================
   โลก
========================= */

.earth{
  position:absolute;

  width:240px;
  height:240px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #c9f3ff 0%,
      #65afea 20%,
      #2868c3 45%,
      #102f78 70%,
      #020817 100%
    );

  box-shadow:
    0 0 40px rgba(70,160,255,.8),
    0 0 100px rgba(50,110,255,.4);

  z-index:2;
}


/* =========================
   วงโคจร
========================= */

.orbit{
  position:absolute;

  width:90vw;
  height:45vw;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  border:
    1px solid
    rgba(100,170,255,.22);

  border-radius:50%;

  z-index:1;
}


/* =========================
   พื้นที่ยาน
========================= */

#ships{
  position:absolute;
  inset:0;
  z-index:20;
}


/* =========================
   UFO
========================= */

.ship{

  position:absolute;

  width:300px;
  height:180px;

  animation:
    fly var(--speed) linear infinite;

  filter:
    drop-shadow(
      0 0 15px
      rgba(50,170,255,.5)
    );
}


/* =========================
   ตัว UFO
========================= */

.ufo{

  position:absolute;

  left:40px;
  top:55px;

  width:220px;
  height:75px;

  border-radius:
    50%;

  background:

    linear-gradient(
      180deg,
      #dce7f2 0%,
      #8798aa 35%,
      #354458 70%,
      #111a28 100%
    );

  border:
    2px solid
    rgba(255,255,255,.6);

  box-shadow:

    inset
    0 10px 15px
    rgba(255,255,255,.35),

    inset
    0 -15px 20px
    rgba(0,0,0,.6),

    0 0 25px
    rgba(80,180,255,.5);

}


/* =========================
   ห้องกระจก
========================= */

.cockpit{

  position:absolute;

  left:70px;
  top:5px;

  width:100px;
  height:55px;

  border-radius:
    50% 50% 45% 45%;

  background:

    radial-gradient(
      circle at 35% 25%,
      rgba(255,255,255,.65),
      #63aee8 20%,
      #163e76 65%,
      #071529 100%
    );

  border:
    3px solid
    #172a43;

  box-shadow:

    0 0 18px
    rgba(80,190,255,.8);

  overflow:hidden;

  z-index:5;
}


/* =========================
   รูปในยาน
========================= */

.cockpit img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}


/* =========================
   แสงกระจก
========================= */

.cockpit::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.35),
      transparent 45%
    );

  pointer-events:none;
}


/* =========================
   วงแหวน UFO
========================= */

.ring{

  position:absolute;

  left:20px;
  top:42px;

  width:260px;
  height:50px;

  border-radius:50%;

  border:
    5px solid
    rgba(55,150,255,.75);

  box-shadow:

    0 0 15px #329dff,
    0 0 30px rgba(50,150,255,.7);

  transform:
    rotate(-3deg);

}


/* =========================
   ไฟใต้ยาน
========================= */

.light{

  position:absolute;

  top:115px;

  width:18px;
  height:18px;

  border-radius:50%;

  background:#6fe8ff;

  box-shadow:
    0 0 10px #6fe8ff,
    0 0 25px #278dff;

  animation:
    blink .5s infinite alternate;

}

.light1{
  left:65px;
}

.light2{
  left:110px;
}

.light3{
  left:155px;
}

.light4{
  left:200px;
}


@keyframes blink{

  from{
    opacity:.35;
  }

  to{
    opacity:1;
  }

}


/* =========================
   เครื่องยนต์
========================= */

.engine{

  position:absolute;

  left:-70px;
  top:78px;

  width:100px;
  height:25px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #287dff,
      #7ceaff,
      white
    );

  clip-path:
    polygon(
      0 50%,
      70% 0,
      100% 50%,
      70% 100%
    );

  filter:
    blur(3px);

}


/* =========================
   การเคลื่อนที่
========================= */

@keyframes fly{

  0%{
    transform:
      translate(
        -350px,
        var(--y1)
      )
      rotate(
        var(--angle)
      )
      scale(
        var(--scale)
      );
  }

  50%{
    transform:
      translate(
        50vw,
        var(--y2)
      )
      rotate(
        calc(var(--angle) * -1)
      )
      scale(
        var(--scale)
      );
  }

  100%{
    transform:
      translate(
        calc(100vw + 350px),
        var(--y3)
      )
      rotate(
        var(--angle)
      )
      scale(
        var(--scale)
      );
  }

}


/* =========================
   หัวเว็บ
========================= */

.title{

  position:absolute;

  top:20px;

  width:100%;

  text-align:center;

  color:white;

  font-size:
    clamp(22px,4vw,40px);

  font-weight:900;

  letter-spacing:6px;

  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;

  z-index:100;
}


.subtitle{

  position:absolute;

  top:65px;

  width:100%;

  text-align:center;

  color:#91aaff;

  font-size:11px;

  letter-spacing:4px;

  z-index:100;
}


/* =========================
   ปุ่ม
========================= */

.upload{

  position:absolute;

  right:20px;
  bottom:20px;

  padding:
    12px 20px;

  border-radius:25px;

  background:#315bd5;

  color:white;

  text-decoration:none;

  z-index:100;

  box-shadow:
    0 0 20px
    rgba(50,120,255,.6);

}


.mission{

  position:absolute;

  bottom:22px;

  left:50%;

  transform:
    translateX(-50%);

  color:#9db6ff;

  font-size:11px;

  letter-spacing:4px;

  z-index:100;

}

</style>
</head>


<body>

<div id="space">

  <div class="title">
    SPACE PHOTO
  </div>

  <div class="subtitle">
    ALIEN SPACE MISSION
  </div>

  <div class="orbit"></div>

  <div class="earth"></div>

  <div id="ships"></div>

  <div class="mission">
    🛸 INFINITE SPACE MISSION
  </div>

  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>

</div>


<script>

/* =========================
   ดาว
========================= */

const space =
  document.getElementById("space");

for(let i=0;i<300;i++){

  const star =
    document.createElement("div");

  star.className="star";

  const size =
    Math.random()*3+1;

  star.style.width =
    size+"px";

  star.style.height =
    size+"px";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*100+"%";

  star.style.opacity =
    Math.random();

  space.appendChild(star);

}


/* =========================
   ระบบยาน
========================= */

const ships =
  document.getElementById("ships");

const shown =
  new Set();


/* =========================
   โหลดรูป
========================= */

async function loadPhotos(){

  try{

    const response =
      await fetch("/api/photos");

    if(!response.ok){
      return;
    }

    const photos =
      await response.json();

    if(!Array.isArray(photos)){
      return;
    }

    photos.forEach(photo=>{

      if(
        shown.has(photo.id)
      ){
        return;
      }

      shown.add(photo.id);

      createShip(photo);

    });

  }catch(error){

    console.log(error);

  }

}


/* =========================
   สร้างยาน
========================= */

function createShip(photo){

  const ship =
    document.createElement("div");

  ship.className="ship";


  /*
   แต่ละลำเร็วไม่เท่ากัน
  */

  const speed =
    10 +
    Math.random()*18;

  ship.style.setProperty(
    "--speed",
    speed+"s"
  );


  /*
   ตำแหน่งสูงต่ำ
  */

  ship.style.setProperty(
    "--y1",
    (5+Math.random()*80)+"vh"
  );

  ship.style.setProperty(
    "--y2",
    (5+Math.random()*80)+"vh"
  );

  ship.style.setProperty(
    "--y3",
    (5+Math.random()*80)+"vh"
  );


  /*
   ขนาดต่างกันเล็กน้อย
  */

  ship.style.setProperty(
    "--scale",
    (.65+Math.random()*.45)
  );


  ship.style.setProperty(
    "--angle",
    (-6+Math.random()*12)+"deg"
  );


  const image =
    photo.data ||
    photo.url ||
    photo.image ||
    photo.src;


  ship.innerHTML=`

    <div class="engine"></div>

    <div class="ufo">

      <div class="ring"></div>

      <div class="cockpit">

        ${
          image
          ?
          `<img src="${image}">`
          :
          ``
        }

      </div>

      <div class="light light1"></div>
      <div class="light light2"></div>
      <div class="light light3"></div>
      <div class="light light4"></div>

    </div>

  `;


  ships.appendChild(ship);

}


/* =========================
   สร้างยานต่อเนื่อง
========================= */

let fakeId = 0;

function createContinuousShip(){

  /*
    ถ้ามีรูปจริง ให้ใช้รูปวนกลับมา
  */

  const existing =
    [...shown];

}


/* โหลดครั้งแรก */

loadPhotos();


/*
  ตรวจรูปใหม่ทุก 2 วินาที
*/

setInterval(
  loadPhotos,
  2000
);

</script>

</body>
</html>
