<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPACE PHOTO MISSION</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,
      #182f6b 0%,
      #09112f 40%,
      #02030b 75%,
      #000 100%);
}

/* ดาว */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  z-index:1;
}

/* โลก */
.earth{
  position:absolute;
  width:230px;
  height:230px;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,
      #d5f8ff 0%,
      #65b3ed 20%,
      #286bc8 45%,
      #102e76 70%,
      #020817 100%);
  box-shadow:
    0 0 40px rgba(70,160,255,.8),
    0 0 100px rgba(50,110,255,.35);
  z-index:2;
}

/* วงโคจร */
.orbit{
  position:absolute;
  width:90vw;
  height:45vw;
  left:50%;
  top:52%;
  transform:
    translate(-50%,-50%)
    rotate(-12deg);
  border:1px solid rgba(120,180,255,.2);
  border-radius:50%;
  z-index:1;
}

/* พื้นที่ยาน */
#ships{
  position:absolute;
  inset:0;
  z-index:20;
}

/* ยาน */
.ship{
  position:absolute;
  width:330px;
  height:190px;
  pointer-events:none;
  animation:
    fly var(--speed)
    linear forwards;
  filter:
    drop-shadow(
      0 0 14px
      var(--glow)
    );
}

/* การบิน */
@keyframes fly{
  0%{
    transform:
      translate(-380px,var(--y1))
      rotate(var(--angle))
      scale(var(--scale));
  }

  50%{
    transform:
      translate(50vw,var(--y2))
      rotate(calc(var(--angle) * -1))
      scale(var(--scale));
  }

  100%{
    transform:
      translate(calc(100vw + 380px),var(--y3))
      rotate(var(--angle))
      scale(var(--scale));
  }
}

/* =================================================
   UFO
================================================= */

.ufo{
  position:absolute;
  left:25px;
  top:55px;
  width:270px;
  height:90px;
  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      var(--ufoTop),
      var(--ufoMid) 45%,
      var(--ufoBottom)
    );

  border:2px solid rgba(255,255,255,.7);

  box-shadow:
    inset 0 10px 18px rgba(255,255,255,.35),
    inset 0 -18px 22px rgba(0,0,0,.65),
    0 0 25px var(--glow);
}

.ufo::before{
  content:"";
  position:absolute;
  left:-8px;
  top:35px;
  width:286px;
  height:50px;
  border-radius:50%;
  border:4px solid var(--rim);
  box-shadow:0 0 14px var(--glow);
}

/* =================================================
   รูปภาพบน UFO — ใหญ่และชัด
================================================= */

.dome{
  position:absolute;

  left:55px;
  top:-25px;

  width:160px;
  height:110px;

  overflow:hidden;

  border-radius:
    50% 50% 45% 45%;

  background:#07182d;

  border:4px solid #203752;

  box-shadow:
    0 0 25px var(--glow),
    0 0 45px var(--glow);

  z-index:5;
}

.dome img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  image-rendering:auto;
}

/* แสงสะท้อนบนกระจก */
.dome::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.35),
      transparent 40%
    );

  pointer-events:none;
}

/* =================================================
   ไฟ UFO
================================================= */

.light{
  position:absolute;
  top:76px;

  width:15px;
  height:15px;

  border-radius:50%;

  background:var(--light);

  box-shadow:
    0 0 10px var(--light),
    0 0 25px var(--light);

  animation:
    blink .45s infinite alternate;
}

.light1{left:38px}
.light2{left:88px}
.light3{left:138px}
.light4{left:188px}

@keyframes blink{
  from{opacity:.35}
  to{opacity:1}
}

/* =================================================
   TITLE
================================================= */

.title{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  color:white;
  font-size:clamp(22px,4vw,40px);
  font-weight:900;
  letter-spacing:6px;

  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;

  z-index:100;
}

.subtitle{
  position:absolute;
  top:64px;
  width:100%;
  text-align:center;
  color:#91aaff;
  font-size:11px;
  letter-spacing:4px;
  z-index:100;
}

/* ปุ่ม */
.upload{
  position:absolute;
  right:20px;
  bottom:20px;

  padding:12px 20px;

  border-radius:25px;

  background:#315bd5;
  color:white;
  text-decoration:none;

  z-index:100;

  box-shadow:
    0 0 20px rgba(50,120,255,.6);
}

.mission{
  position:absolute;
  bottom:22px;
  left:50%;

  transform:
    translateX(-50%);

  color:#9db6ff;

  font-size:11px;
  letter-spacing:4px;

  z-index:100;

  white-space:nowrap;
}
</style>
</head>

<body>

<div id="space">

  <div class="title">
    SPACE PHOTO
  </div>

  <div class="subtitle">
    SPACE PHOTO MISSION
  </div>

  <div class="orbit"></div>

  <div class="earth"></div>

  <div id="ships"></div>

  <div class="mission">
    🚀 🛸 🛰️ INFINITE SPACE MISSION
  </div>

  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>

</div>

<script>

/* =================================================
   ดาว
================================================= */

const space =
  document.getElementById("space");

for(let i=0;i<300;i++){

  const star =
    document.createElement("div");

  star.className="star";

  const size =
    Math.random()*3+1;

  star.style.width=size+"px";
  star.style.height=size+"px";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*100+"%";

  star.style.opacity =
    Math.random();

  space.appendChild(star);
}


/* =================================================
   ระบบยาน
================================================= */

const ships =
  document.getElementById("ships");

let photos=[];


/* =================================================
   โหลดรูป
================================================= */

async function loadPhotos(){

  try{

    const response =
      await fetch("/api/photos");

    if(!response.ok){
      return;
    }

    const data =
      await response.json();

    if(!Array.isArray(data)){
      return;
    }

    /*
      เอาเฉพาะ 10 รูปล่าสุด
    */
    photos =
      data.slice(-10);

  }catch(error){

    console.log(
      "Photo API error:",
      error
    );

  }
}


/* =================================================
   หาที่อยู่รูป
================================================= */

function getImage(photo){

  return (
    photo.data ||
    photo.url ||
    photo.image ||
    photo.src ||
    ""
  );

}


/* =================================================
   สร้าง UFO
================================================= */

function createUFO(){

  if(photos.length===0){
    return;
  }

  const photo =
    photos[
      Math.floor(
        Math.random()*photos.length
      )
    ];

  const image =
    getImage(photo);

  if(!image){
    return;
  }

  const ship =
    document.createElement("div");

  ship.className="ship";


  /* ความเร็ว */

  const speed =
    12 + Math.random()*12;

  ship.style.setProperty(
    "--speed",
    speed+"s"
  );


  /* เส้นทาง */

  ship.style.setProperty(
    "--y1",
    (5+Math.random()*82)+"vh"
  );

  ship.style.setProperty(
    "--y2",
    (5+Math.random()*82)+"vh"
  );

  ship.style.setProperty(
    "--y3",
    (5+Math.random()*82)+"vh"
  );


  /* ขนาด UFO */

  ship.style.setProperty(
    "--scale",
    .65+Math.random()*.25
  );


  /* มุม */

  ship.style.setProperty(
    "--angle",
    (-5+Math.random()*10)+"deg"
  );


  /* สี UFO */

  const colors=[

    [
      "#eef4fa",
      "#aab8c7",
      "#202a38",
      "#39c6ff",
      "#5de8ff"
    ],

    [
      "#ffffff",
      "#b7a9c8",
      "#30203e",
      "#d75cff",
      "#f06cff"
    ],

    [
      "#f4fff4",
      "#a6c4aa",
      "#1b3320",
      "#5dff7c",
      "#66ff88"
    ],

    [
      "#fff5dc",
      "#c7a77d",
      "#352518",
      "#ffb52e",
      "#ffd15c"
    ],

    [
      "#f4f4ff",
      "#8f9fc4",
      "#17203b",
      "#668cff",
      "#739aff"
    ]

  ];

  const c =
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  ship.style.setProperty("--ufoTop",c[0]);
  ship.style.setProperty("--ufoMid",c[1]);
  ship.style.setProperty("--ufoBottom",c[2]);
  ship.style.setProperty("--rim",c[3]);
  ship.style.setProperty("--light",c[4]);
  ship.style.setProperty(
    "--glow",
    c[4]
  );


  /* UFO */

  ship.innerHTML=`

    <div class="ufo">

      <div class="dome">

        <img
          src="${image}"
          alt="Space Photo"
        >

      </div>

      <div class="light light1"></div>
      <div class="light light2"></div>
      <div class="light light3"></div>
      <div class="light light4"></div>

    </div>

  `;

  ships.appendChild(ship);


  /* ลบเมื่อบินออก */

  setTimeout(
    ()=>{
      ship.remove();
    },
    speed*1000+1000
  );

}


/* =================================================
   เริ่มระบบ
================================================= */

async function start(){

  await loadPhotos();


  /*
    ปล่อย UFO ต่อเนื่อง
    ไม่มีช่วงว่าง
  */

  for(let i=0;i<10;i++){

    setTimeout(
      createUFO,
      i*700
    );

  }


  setInterval(
    createUFO,
    900
  );


  /*
    ตรวจรูปใหม่ทุก 5 วินาที
  */

  setInterval(
    loadPhotos,
    5000
  );

}

start();

</script>

</body>
</html>
