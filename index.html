<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE PHOTO MISSION</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #16295e 0%,
      #080d25 38%,
      #02030b 75%,
      #000 100%
    );
}


/* ดาว */

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  z-index:1;
}


/* โลก */

.earth{
  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #c8f3ff 0%,
      #66b0ef 18%,
      #2868c5 42%,
      #102e78 68%,
      #020817 100%
    );

  box-shadow:
    0 0 40px rgba(70,160,255,.9),
    0 0 100px rgba(50,110,255,.4);

  z-index:2;
}


/* เส้นวงโคจร */

.orbit{
  position:absolute;

  width:90vw;
  height:45vw;

  max-width:1500px;
  max-height:700px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-12deg);

  border:
    1px solid
    rgba(120,180,255,.25);

  border-radius:50%;

  z-index:1;
}


/* พื้นที่ยาน */

#ships{
  position:absolute;
  inset:0;
  z-index:20;
}


/* =========================
   ยาน
========================= */

.ship{

  position:absolute;

  width:760px;
  height:420px;

  animation:
    fly var(--speed) linear infinite;

  filter:
    drop-shadow(
      0 15px 30px
      rgba(0,0,0,.8)
    );

}


/* ตัวลำยาน */

.body{

  position:absolute;

  left:100px;
  top:125px;

  width:500px;
  height:155px;

  border-radius:
    55% 45% 45% 55%;

  background:
    linear-gradient(
      180deg,
      #f5f8fc 0%,
      #b9c5d4 30%,
      #65758a 65%,
      #202c3d 100%
    );

  border:
    3px solid
    rgba(255,255,255,.55);

  box-shadow:

    inset 0 15px 25px
    rgba(255,255,255,.4),

    inset 0 -25px 30px
    rgba(0,0,0,.5),

    0 0 30px
    rgba(80,160,255,.45);

  transform:
    rotateY(-8deg)
    rotateX(5deg);

}


/* ปีกบน */

.wingTop{

  position:absolute;

  left:110px;
  top:-95px;

  width:250px;
  height:110px;

  background:
    linear-gradient(
      135deg,
      #74859b,
      #182233
    );

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      68% 0
    );

}


/* ปีกล่าง */

.wingBottom{

  position:absolute;

  left:110px;
  bottom:-95px;

  width:250px;
  height:110px;

  background:
    linear-gradient(
      45deg,
      #74859b,
      #182233
    );

  clip-path:
    polygon(
      0 0,
      100% 0,
      68% 100%
    );

}


/* =========================
   หน้าต่างขนาดใหญ่
========================= */

.window{

  position:absolute;

  left:175px;
  top:18px;

  width:210px;
  height:125px;

  border-radius:50%;

  overflow:hidden;

  background:#020713;

  border:
    11px solid
    #172238;

  box-shadow:

    0 0 0 4px
    #53677f,

    0 0 35px
    rgba(50,170,255,.9),

    inset 0 0 25px #000;

  z-index:10;

}


/* รูป */

.window img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

}


/* กระจก */

.reflection{

  position:absolute;

  left:190px;
  top:28px;

  width:180px;
  height:100px;

  border-radius:50%;

  background:
    linear-gradient(
      130deg,
      rgba(255,255,255,.38),
      transparent 42%
    );

  pointer-events:none;

  z-index:11;

}


/* เครื่องยนต์ */

.engine{

  position:absolute;

  left:25px;
  top:42px;

  width:75px;
  height:75px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #aebed0 0%,
      #52657e 35%,
      #111a29 75%
    );

  box-shadow:
    inset 0 0 18px #000;

}


/* แสงเครื่องยนต์ */

.flame{

  position:absolute;

  left:-150px;
  top:145px;

  width:150px;
  height:50px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #1f65ff,
      #64dcff,
      white
    );

  clip-path:
    polygon(
      0 50%,
      70% 0,
      100% 50%,
      70% 100%
    );

  filter:blur(4px);

  animation:
    pulse .15s infinite alternate;

}


@keyframes pulse{

  from{
    transform:scaleX(.65);
    opacity:.6;
  }

  to{
    transform:scaleX(1.2);
    opacity:1;
  }

}


/* จมูกยาน */

.nose{

  position:absolute;

  right:-125px;
  top:5px;

  width:155px;
  height:145px;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #9aaabd,
      #354255
    );

  clip-path:
    polygon(
      0 0,
      100% 50%,
      0 100%
    );

}


/* ไฟหัว */

.light{

  position:absolute;

  right:-135px;
  top:60px;

  width:18px;
  height:35px;

  border-radius:50%;

  background:#8eeaff;

  box-shadow:
    0 0 20px #62d8ff,
    0 0 40px #3288ff;

}


/* =========================
   บิน
========================= */

@keyframes fly{

  0%{
    transform:
      translate(-850px,var(--y1))
      rotate(-5deg)
      scale(.8);
  }

  25%{
    transform:
      translate(18vw,var(--y2))
      rotate(3deg)
      scale(1);
  }

  50%{
    transform:
      translate(45vw,var(--y3))
      rotate(-3deg)
      scale(1.08);
  }

  75%{
    transform:
      translate(72vw,var(--y2))
      rotate(3deg)
      scale(1);
  }

  100%{
    transform:
      translate(calc(100vw + 850px),var(--y1))
      rotate(-4deg)
      scale(.8);
  }

}


/* ชื่อ */

.title{

  position:absolute;

  top:22px;

  width:100%;

  text-align:center;

  color:white;

  font-size:
    clamp(24px,4vw,42px);

  font-weight:900;

  letter-spacing:7px;

  text-shadow:
    0 0 15px #64aaff,
    0 0 40px #2765dc;

  z-index:100;

}


.subtitle{

  position:absolute;

  top:70px;

  width:100%;

  text-align:center;

  color:#91aaff;

  font-size:12px;

  letter-spacing:5px;

  z-index:100;

}


/* ปุ่ม Upload */

.upload{

  position:absolute;

  right:25px;
  bottom:20px;

  padding:14px 24px;

  border-radius:30px;

  background:#315bd5;

  color:white;

  text-decoration:none;

  z-index:100;

  box-shadow:
    0 0 25px
    rgba(50,120,255,.6);

}


/* ด้านล่าง */

.mission{

  position:absolute;

  bottom:25px;

  left:50%;

  transform:translateX(-50%);

  color:#9db6ff;

  font-size:12px;

  letter-spacing:4px;

  z-index:100;

}

</style>
</head>


<body>

<div id="space">

  <div class="title">
    SPACE PHOTO
  </div>

  <div class="subtitle">
    EVERY PHOTO • A NEW SPACE MISSION
  </div>

  <div class="orbit"></div>

  <div class="earth"></div>

  <div id="ships"></div>

  <div class="mission">
    🛰️ SPACE EXPLORATION MISSION
  </div>

  <a
    class="upload"
    href="/upload.html"
  >
    📸 UPLOAD PHOTO
  </a>

</div>


<script>

/* ดาว */

const space =
  document.getElementById("space");

for(let i=0;i<300;i++){

  const star =
    document.createElement("div");

  star.className="star";

  const size =
    Math.random()*3+1;

  star.style.width =
    size+"px";

  star.style.height =
    size+"px";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*100+"%";

  star.style.opacity =
    Math.random();

  space.appendChild(star);
}


/* ยาน */

const ships =
  document.getElementById("ships");

const shown =
  new Set();


/* โหลดรูป */

async function loadPhotos(){

  try{

    const response =
      await fetch("/api/photos");

    if(!response.ok){
      return;
    }

    const photos =
      await response.json();

    if(!Array.isArray(photos)){
      return;
    }

    photos.forEach(photo=>{

      if(shown.has(photo.id)){
        return;
      }

      shown.add(photo.id);

      createShip(photo);

    });

  }catch(error){

    console.log(
      "Cannot load photos:",
      error
    );

  }

}


/* สร้างยาน */

function createShip(photo){

  const ship =
    document.createElement("div");

  ship.className="ship";


  ship.style.setProperty(
    "--speed",
    (18+Math.random()*8)+"s"
  );

  ship.style.setProperty(
    "--y1",
    (5+Math.random()*75)+"vh"
  );

  ship.style.setProperty(
    "--y2",
    (8+Math.random()*70)+"vh"
  );

  ship.style.setProperty(
    "--y3",
    (5+Math.random()*75)+"vh"
  );


  /*
    รองรับทั้ง photo.data
    และ photo.url
  */

  const image =
    photo.data ||
    photo.url ||
    photo.image ||
    photo.src;


  ship.innerHTML = `

    <div class="flame"></div>

    <div class="body">

      <div class="wingTop"></div>

      <div class="wingBottom"></div>

      <div class="engine"></div>

      <div class="window">

        ${
          image
          ?
          `<img src="${image}">`
          :
          `<div style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6faaff;
            font-size:20px;
          ">
            SPACE
          </div>`
        }

      </div>

      <div class="reflection"></div>

      <div class="nose"></div>

      <div class="light"></div>

    </div>

  `;


  ships.appendChild(ship);

}


/* เริ่ม */

loadPhotos();


/* ตรวจรูปใหม่ทุก 3 วินาที */

setInterval(
  loadPhotos,
  3000
);

</script>

</body>
</html>
